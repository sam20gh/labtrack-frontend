name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck
        # Reached zero errors in Phase 10; this keeps it there
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint
        continue-on-error: true

      - name: Bundle
        # The strongest signal available without a device: catches missing modules,
        # bad imports, and native modules that cannot resolve
        run: npx expo export --platform android --output-dir dist
